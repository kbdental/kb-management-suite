 control programme is documented, which aims at preventing and reducing the risk of healthcare associated infections in the organisation. *","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.1.b.","desc":"The infection prevention and control programme identify high-risk activities, and has written guidance to prevent and manage infections for these activities. *","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.1.c.","desc":"The infection prevention and control programme is reviewed and updated at least once a year.","type":"Commitment","prev_hco":4.0,"prev_assessor":5.0},{"code":"IPC.1.d.","desc":"The infection prevention and control programme is reviewed based on infection control assessment tool.","type":"Achievement","prev_hco":0.0,"prev_assessor":0.0},{"code":"IPC.1.e.","desc":"The DHSP has a multidisciplinary infection control committee, which co-ordinates all infection prevention and control activities. *","type":"Commitment","prev_hco":0.0,"prev_assessor":0.0},{"code":"IPC.1.f.","desc":"The DHSP has an infection control team, which coordinates the implementation of all infection prevention and control activities. *","type":"Commitment","prev_hco":0.0,"prev_assessor":0.0},{"code":"IPC.1.g.","desc":"The DHSP has a designated infection control nurse(s) as part of the infection control team. *","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.1.h.","desc":"The DHSP implements information, education and communication programme for infection prevention and control activities for the community.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.1.i.","desc":"The  DHSP  participates in managing community outbreaks.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0}],"hco_avg":4.833333333333333,"assessor_avg":5.0},{"code":"IPC.2","title":"IPC.2. The DHSP provides adequate and appropriate resources for infection prevention and control.","mes":[{"code":"IPC.2.a.","desc":"DHSP management makes available resources required for the infection prevention and control program.","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.2.b.","desc":"The DHSP regularly earmarks adequate funds from its annual budget in this regard.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.2.c.","desc":"It also conducts regular “in-service” training sessions for all concerned categories of staff at least once in a year.","type":"Commitment","prev_hco":5.0,"prev_assessor":3.0},{"code":"IPC.2.d.","desc":"Appropriate pre- and post- exposure prophylaxis is provided to all concerned staff members.","type":"Commitment","prev_hco":5.0,"prev_assessor":3.0},{"code":"IPC.2.e.","desc":"Adequate and appropriate facilities for hand hygiene in all patient-care areas are accessible to healthcare providers.","type":"Core","prev_hco":5.0,"prev_assessor":3.0},{"code":"IPC.2.f.","desc":"Compliance with proper hand washing/scrubbing is monitored regularly.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.2.g.","desc":"Adequate and appropriate personal protective equipment, soaps, and disinfectants are available and used correctly.","type":"Commitment","prev_hco":5.0,"prev_assessor":3.0}],"hco_avg":5.0,"assessor_avg":3.857142857142857},{"code":"IPC.3","title":"IPC.3. The DHSP implements the infection prevention and control programme in clinical areas.","mes":[{"code":"IPC.3.a.","desc":"The DHSP adheres to standard precautions at all times. *","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.3.b.","desc":"The DHSP adheres to hand-hygiene guidelines. *","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.3.c.","desc":"The DHSP adheres to safe injection and infusion practices.","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.3.d.","desc":"Appropriate antimicrobial usage policy is established and documented *","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.3.e.","desc":"The organisation implements the antimicrobial usage policy and monitors the rational use of antimicrobial agents.","type":"Core","prev_hco":2.0,"prev_assessor":1.0},{"code":"IPC.3.f.","desc":"The DHSP implements an antibiotic stewardship programme. *","type":"Excellence","prev_hco":2.0,"prev_assessor":1.0}],"hco_avg":4.0,"assessor_avg":3.6666666666666665},{"code":"IPC.4","title":"IPC.4. The DHSP implements the infection prevention and control programme in non-clinical areas.","mes":[{"code":"IPC.4.a.","desc":"The organisation has appropriate engineering controls to prevent infections. *","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.4.b.","desc":"The organisation designs and implements a plan to reduce the risk of infection during construction and renovation. *","type":"Commitment","prev_hco":2.0,"prev_assessor":5.0},{"code":"IPC.4.c.","desc":"The organisation adheres to housekeeping procedures. *","type":"Core","prev_hco":5.0,"prev_assessor":3.0},{"code":"IPC.4.d.","desc":"Biomedical waste (BMW) is handled appropriately and safely.","type":"Core","prev_hco":5.0,"prev_assessor":5.0}],"hco_avg":4.25,"assessor_avg":4.5},{"code":"IPC.5","title":"IPC.5. The organisation performs surveillance to capture and monitor infection prevention and control data.","mes":[{"code":"IPC.5.a.","desc":"Surveillance activities are appropriately directed towards the identified high-risk areas.","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.5.b.","desc":"Verification of data is done regularly by the infection control team.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.5.c.","desc":"Scope of surveillance incorporates tracking and analysing of infection rates and trends.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.5.d.","desc":"Surveillance includes monitoring compliance with hand-hygiene guidelines.","type":"Core","prev_hco":5.0,"prev_assessor":5.0},{"code":"IPC.5.e.","desc":"Surveillance activities include monitoring th ee infection control activities.","type":"Core","prev_hco":0.0,"prev_assessor":0.0},{"code":"PSQ.2.d.","desc":"The organisation identifies and monitors key indicators to oversee the managerial structures, processes and outcomes.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"PSQ.2.e.","desc":"Verification of data is done regularly by the quality team.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"PSQ.2.f.","desc":"There is a mechanism for analysis of data which results in identifying opportunities for improvement.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"PSQ.2.g.","desc":"The improvements are implemented and evaluated.","type":"Commitment","prev_hco":5.0,"prev_assessor":5.0},{"code":"PSQ.2.h.","desc":"Feedback about care and service is communicated to staff.","type":"Achievement","prev_hco":3.0,"prev_assessor":2.0}],"hco_avg":4.285714285714286,"assessor_avg":4.571428571428571},{"code":"PSQ.3","title":"PSQ.3. The quality improvement program is supported by the management.","mes":[{"code":"PSQ.3.a.","desc":"The management creates a culture of safety.","type":"Achievement","prev_hco":4.0,"prev_assessor":5.0},{"code":"PSQ.3.b.","desc":"DHSP management makes available adequate resources including annual budget required for quality improvement program.","type":"Commitment","prev_hco":4.0,"prev_assessor":5.0},{"code":"PSQ.3.c.","desc":"The management identifies organisational performance improvement targets.","type":"Achievement","prev_hco":4.0,"prev_assessor":3.0},{"code":"PSQ.3.d.","desc":"The management uses the feedback obtained from the workforce to improve patient safety and quality improvement programme.","type":"Achievement","prev_hco":4.0,"prev_assessor":5.0}],"hco_avg":4.0,"assessor_avg":4.5},{"code":"PSQ.4","title":"PSQ.4. There is an established system for clinical audit.","mes":[{"code":"PSQ.4.a.","desc":"Clinical audits are performed to improve the quality of patient care.","type":"Commitment","p         var asc=Object.assign({},prev.cur.assessor_scores||{});

  function calcCh(chId,scores){
    var ch=NABH_DATA.find(function(c){return c.id===chId;});
    if(!ch)return{pct:0,s:0,p:0,done:0,tot:0,flags:0};
    var s=0,p=0,done=0,tot=0,flags=0;
    ch.standards.forEach(function(std){std.mes.forEach(function(me){
      var v=scores[me.code]; tot++;
      if(v!==null){done++;}
      if(v===null||v===0)return;
      p+=5;s+=v;
      if(v<=3)flags++;
    });});
    return{pct:p>0?Math.round(s/p*100):0,s:s,p:p,done:done,tot:tot,flags:flags};
  }
  function calcAll(scores){
    var s=0,p=0,done=0,tot=0;
    var bt={Core:{s:0,p:0},Commitment:{s:0,p:0},Achievement:{s:0,p:0},Excellence:{s:0,p:0}};
    NABH_DATA.forEach(function(ch){ch.standards.forEach(function(std){std.mes.forEach(function(me){
      var v=scores[me.code]; tot++;
      if(v!==null)done++;
      if(v===null||v===0)return;
      p+=5;s+=v;
      if(bt[me.type]){bt[me.type].s+=v;bt[me.type].p+=5;}
    });});});
    return{pct:p>0?Math.round(s/p*100):0,s:s,p:p,done:done,tot:tot,bt:bt};
  }
  function sc(pct){return pct>=80?G:pct>=60?AM:pct>=40?'#F9A825':R;}

          ),

        ),
        renderAssessment(rec.scores,rec.notes,true,rec.assessor_scores||{})
      );
    }

    /* ── Excel import parser ── */
    function importExcel(file){
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var wb = XLSX.read(ev.target.result, {type:'array'});
          var ws = wb.Sheets['Sheet1'] || wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

          var hcoScores={}, assessorScores={};
          var mePattern = /^([A-Z0M]+\.\d+[a-z]?\.?\s*[a-z]?\.?)$/;

          rows.forEach(function(row){
            var code = String(row[0]||'').trim();
            var hco  = parseFloat(row[5]);
            var asst = parseFloat(row[9]);
            // ME row: col0 is code like AAC.1.a. and col1 has description
            if(row[1] && code && /^[A-Z0M]+\.\d+/.test(code) && code.length < 20){
              var cleanCode = code.replace(/\s+/g,'');
              if(!isNaN(hco))  hcoScores[cleanCode]  = hco;
              if(!isNaN(asst)) assessorScores[cleanCode] = asst;
            }
          });

          var count = Object.keys(hcoScores).length;
          if(count < 10){
            toast('Could not read scores from this file ('+count+' found). Check it is the NABH assessment sheet.',false);
            return;
          }

          var label = file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ') || 'Imported Assessment';
          var rec = {
            id:'ass_import_'+Date.now(),
            label:label,
            date:kbdcToday(),
            scores:hcoScores,
            assessor_scores:assessorScores,
            notes:{},
            locked:true
          };

          upd(function(prev){
            var hist=[rec].concat(prev.history);
            lsS(KEYS.history,hist);
            return{history:hist};
          });
          toast('✓ Imported '+count+' ME scores from '+file.name);
        }catch(err){
          toast('Import failed: '+err.message,false);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    return e('div',{style:{flex:1,overflowY:'auto',padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}},
      e('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:4}},
        e('div',{style:{flex:1,fontSize:14,fontWeight:700,color:B}},'📚 Assessment History'),
        e('label',{style:{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',
          background:'linear-gradient(135deg,'+B+','+BM+')',color:W,borderRadius:8,
          fontSize:12,fontWeight:700,cursor:'pointer'}},
          '⬆️ Import Excel',
          e('input',{type:'file',accept:'.xlsx,.xls',style:{display:'none'},
            onChange:function(ev){
              var f=ev.target.files[0];
              if(f){importExcel(f);}
              ev.target.value='';
            }})
        )
      ),
      st.history.length===0
        ? e('div',{style:{textAlign:'center',padding:'40px',color:GR}},
            e('div',{style:{fontSize:32,marginBottom:10}},'📋'),
            e('div',{style:{fontSize:13}},'No past assessments yet.'))
        : st.history.map(function(rec){
          var ov2=calcAll(rec.scores);
          return e('div',{key:rec.id,style:{background:W,borderRadius:14,border:'1px solid #E8EAF6',overflow:'hidden'}},
            e('div',{style:{padding:'14px 18px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',background:BL},
              onClick:function(){upd({histView:rec.id,selChapter:'AAC'});}},
              e('div',{style:{flex:1}},
                e('div',{style:{fontSize:13,fontWeight:700,color:B,marginBottom:2}},rec.label),
                e('div',{style:{fontSize:11,color:GR}},rec.date+(rec.locked?' · 🔒':' · Draft'))
              ),
              e('div',{style:{textAlign:'center',marginRight:8}},
                e('div',{style:{fontSize:22,fontWeight:800,color:sc(ov2.pct)}},ov2.pct+'%'),
                e('div',{style:{fontSize:10,color:GR}},ov2.done+'/'+ov2.tot+' scored')
              ),
              e('span',{style:{fontSize:11,color:B,fontWeight:600}},'View →')
            ),
            e('div',{style:{padding:'10px 18px',display:'flex',gap:6,flexWrap:'wrap',borderTop:'1px solid #F0F4FF'}},
              NABH_DATA.map(function(ch){
                var cp=calcCh(ch.id,rec.scores);
                return e('div',{key:ch.id,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2}},

  /* ── Year tab wrapper ── */
  function renderAssessmentWithYears(){
    var curYear = (st.cur.date||'').slice(0,4) || String(new Date().getFullYear());

    // Collect all history years (deduplicated)
    var seen={};
    var histEntries=[];
    st.history.forEach(function(h){
      var yr=(h.date||'').slice(0,4)||((h.label||'').match(/\d{4}/)||[])[0]||'?';
      if(!seen[yr]){ seen[yr]=true; histEntries.push({year:yr,rec:h}); }
    });
    // Sort descending
    histEntries.sort(function(a,b){return b.year.localeCompare(a.year);});

    var selYear = st.selYear || curYear;
    var selRec  = selYear===curYear ? null : (st.history.find(function(h){
      var yr=(h.date||'').slice(0,4)||((h.label||'').match(/\d{4}/)||[])[0]||'?';
      return yr===selYear;
    })||null);

    return e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},

      /* Year selector bar */
      e('div',{style:{background:'#fff',borderBottom:'1.5px solid #E8EAF6',
        display:'flex',alignItems:'center',flexShrink:0,padding:'0 12px',gap:0,overflowX:'auto'}},

        /* Current year tab */
        e('div',{onClick:function(){upd({selYear:curYear,selChapter:'AAC'});},
          style:{padding:'9px 16px',cursor:'pointer',whiteSpace:'nowrap',
            borderBottom:'2.5px solid '+(selYear===curYear?'#1A237E':'transparent'),
            fontSize:12,fontWeight:selYear===curYear?700:400,
            color:selYear===curYear?'#1A237E':'#546E7A',
            display:'flex',alignItems:'center',gap:6}},
          e('span',null,'✍️'),
          e('span',null,curYear),
          selYear===curYear&&e('span',{style:{background:'#E8F5E9',color:'#2E7D32',
            borderRadius:10,padding:'1px 7px',fontSize:9.5,fontWeight:700}},'Active')
        ),

        /* History year tabs */
        histEntries.map(function(hy){
          var act=selYear===hy.year;
          return e('div',{key:hy.year,
            onClick:function(){upd({selYear:hy.year,selChapter:'AAC'});},
            style:{padding:'9px 16px',cursor:'pointer',whiteSpace:'nowrap',
              borderBottom:'2.5px solid '+(act?'#1A237E':'transparent'),
              fontSize:12,fontWeight:act?700:400,
              color:act?'#1A237E':'#546E7A',
              display:'flex',alignItems:'center',gap:6}},
            e('span',null,'🔒'),
            e('span',null,hy.year),
            act&&e('span',{style:{background:'#E8EAF6',color:'#546E7A',
              borderRadius:10,padding:'1px 7px',fontSize:9.5,fontWeight:700}},'Read Only')
          );
        }),

        /* Spacer + New Year button */
        e('div',{style:{flex:1}}),
        e('button',{
          onClick:function(){
            var yr=window.prompt('Enter assessment year (e.g. 2027):',String(parseInt(curYear)+1));
            if(!yr||isNaN(parseInt(yr)))return;
            yr=yr.trim();
            if(yr===curYear){toast('Already on '+yr,false);return;}
            // Check if that year already has a history record
            var exists=st.history.some(function(h){
              return ((h.date||'').slice(0,4)||((h.label||'').match(/\d{4}/)||[])[0]||'?')===yr;
            });
            if(exists&&!window.confirm(yr+' already exists in History. Still start a new current assessment for '+yr+'?'))return;
            upd(function(prev){
              var nc=emptySheet('Self Assessment '+yr);
              nc.date=yr+'-01-01';
              lsS(KEYS.cur,nc);
              return{cur:nc,selYear:yr,selChapter:'AAC'};
            });
            toast('Started new assessment for '+yr+' ✓');
          },
          style:{margin:'6px 0 6px 8px',padding:'5px 14px',flexShrink:0,
            background:'#1A237E',color:'#fff',border:'none',borderRadius:8,
            fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}
        },'+ New Year')
      ),

      /* Assessment content */
      selRec
        ? renderAssessment(selRec.scores,selRec.notes,true,selRec.assessor_scores||{})
        : renderAssessment()
    );
  }

    var TABS=[{id:'dashboard',icon:'📊',label:'Dashboard'},
            {id:'assessment',icon:'✍️',label:'Assessment'},
            {id:'history',icon:'📚',label:'History ('+st.history.length+')'}];

  return e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',fontFamily:"'Poppins',sans-serif",background:GRL}},
    st.toast&&e('div',{style:{position:'fixed',top:16,right:16,zIndex:9999,
      background:st.toast.ok!==false?G:R,color:W,padding:'10px 18px',borderRadius:10,
      fontSize:12.5,fontWeight:600,boxShadow:'0 4px 16px rgba(0,0,0,.2)'}},st.toast.msg),

    e('div',{style:{background:'linear-gradient(135deg,#0D1B6E,'+B+')',padding:'11px 18px',flexShrink:0}},
      e('div',{style:{display:'flex',alignItems:'center',gap:12}},
        e('div',{style:{background:'rgba(255,255,255,.15)',borderRadius:8,padding:'5px 11px',
          fontSize:13,fontWeight:700,color:W,border:'1.5px solid rgba(255,255,255,.25)'}},'NABH'),
        e('div',{style:{flex:1}},
          e('div',{style:{fontSize:13.5,fontWeight:700,color:W}},'NABH DHSP Accreditation · 3rd Edition'),
          e('div',{style:{fontSize:10.5,color:'rgba(255,255,255,.6)'}},st.cur.label+(st.cur.locked?' 🔒':' ✍️')+' · '+st.cur.date)
        ),
        e('div',{style:{background:sc(ov.pct)+'CC',color:W,padding:'6px 14px',borderRadius:20,fontSize:12,fontWeight:700}},
          ov.pct+'% Compliant')
      )
    ),

    e('div',{style:{background:W,borderBottom:'1px solid #E8EAF6',display:'flex',padding:'0 16px',flexShrink:0}},
      TABS.map(function(tab){
        var act=st.tab===tab.id;
        return e('div',{key:tab.id,onClick:function(){upd({tab:tab.id});},
          style:{padding:'10px 16px',cursor:'pointer',borderBottom:'2.5px solid '+(act?B:'transparent'),
            fontSize:12,fontWeight:act?700:400,color:act?B:GR,
            display:'flex',alignItems:'center',gap:5,whiteSpace:'nowrap'}},
          tab.icon,' ',tab.label);
      })
    ),

    e('div',{style:{flex:1,display:'flex',overflow:'hidden'}},
      st.tab==='dashboard'  && renderDash(),
      st.tab==='assessment' && renderAssessmentWithYears(),
      st.tab==='history'    && renderHistory()
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(NabhPage, null));
</script>
</body>
</html>
