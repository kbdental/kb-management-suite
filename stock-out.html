<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A237E">
<title>K.B. Dental — Stock Out Entry</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF2FB;color:#1A2340;min-height:100vh;padding:16px}
  .wrap{max-width:460px;margin:0 auto}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(26,35,126,.10);overflow:hidden}
  .hdr{background:linear-gradient(135deg,#1A237E,#1357A6);color:#fff;padding:20px 22px}
  .hdr h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  .hdr p{font-size:12px;opacity:.8;margin-top:3px}
  .body{padding:20px 22px}
  label{display:block;font-size:11px;font-weight:700;color:#5A6B8C;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:12px 13px;border:1.6px solid #DCE3F2;border-radius:10px;font-size:15px;font-family:inherit;outline:none;background:#fff;color:#1A2340}
  input:focus,select:focus,textarea:focus{border-color:#1357A6}
  textarea{min-height:60px;resize:vertical}
  .hint{font-size:11.5px;color:#8A97B4;margin-top:4px}
  .stockpill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:6px}
  .ok{background:#E7F6EC;color:#1B7A3D}.low{background:#FFF3E0;color:#B5651D}.out{background:#FDECEC;color:#C62828}
  button{width:100%;margin-top:22px;padding:15px;border:none;border-radius:11px;background:linear-gradient(135deg,#1A237E,#1357A6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;font-weight:600;line-height:1.5;display:none}
  .msg.show{display:block}
  .msg.good{background:#E7F6EC;color:#1B7A3D}
  .msg.bad{background:#FDECEC;color:#C62828}
  .loading{text-align:center;color:#8A97B4;font-size:13px;padding:30px 0}
  .foot{text-align:center;font-size:11px;color:#9AA6C2;margin-top:16px}
  .recent{margin-top:18px}
  .recent h2{font-size:11px;font-weight:700;color:#8A97B4;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .rrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:8px 0;border-top:1px solid #EEF1F8;color:#4A5876}
  .rrow b{color:#1A2340}
  .whoami{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F0F4FF;border-radius:8px;font-size:13px}
  .whoami b{color:#1A237E}
  .linkbtn{width:auto;margin:0;padding:0;background:none;color:#8A97B4;font-size:11px;font-weight:600;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <h1>📤 Stock Out Entry</h1>
      <p>K.B. Dental Clinic — record an item you have taken out</p>
    </div>
    <div class="body" id="body">
      <div class="loading" id="loading">Loading staff list…</div>

      <div id="login" style="display:none">
        <label for="loginName">Your Name</label>
        <select id="loginName"><option value="">-- Select your name --</option></select>

        <label for="loginPin">Your PIN</label>
        <input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="4-6 digit PIN" autocomplete="off">

        <button id="loginBtn">Unlock</button>
        <div class="msg" id="loginMsg"></div>
      </div>

      <div id="form" style="display:none">
        <div class="whoami">
          <span>Logged in as <b id="whoName"></b></span>
          <button class="linkbtn" id="switchUser" type="button">Not you?</button>
        </div>

        <label for="item">Item</label>
        <select id="item"><option value="">-- Select item --</option></select>
        <input id="itemText" style="display:none;margin-top:8px" placeholder="Type item name">
        <div class="hint" id="stockHint"></div>

        <label for="qty">Quantity Taken</label>
        <input id="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 5">

        <label for="to">Issued To / Purpose <span style="text-transform:none;font-weight:400;color:#9AA6C2">(optional)</span></label>
        <input id="to" placeholder="e.g. OPD room / Dr. Sharma">

        <label for="note">Notes <span style="text-transform:none;font-weight:400;color:#9AA6C2">(optional)</span></label>
        <textarea id="note" placeholder="Any extra detail"></textarea>

        <button id="submit">Submit Stock Out</button>
        <div class="msg" id="msg"></div>

        <div class="recent" id="recentWrap" style="display:none">
          <h2>Your recent entries</h2>
          <div id="recent"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">Entries are saved to the clinic's Google Sheet · Stock is adjusted by the store in-charge</div>
</div>

<script>
// ─── Config (same backend + shared-secret token the main app uses) ───────
// This page is a static file — anything in it, including this token, ships
// to whoever loads the page and can always be read from "view source". It
// is not a real secret and shouldn't be treated as one: it only cuts down
// on drive-by/bot traffic hitting the Apps Script URL, nothing more. The
// actual access control is the name+PIN check below, checked against each
// employee's own HR record (same PIN they use to log into the main app).
// If this token is ever rotated, update it here, in the main app's
// Settings → Data Backend, and in the Apps Script API_TOKEN Script
// Property — all three have to match.
var INV_BACKEND_URL  = 'https://script.google.com/macros/s/AKfycbw5XgC4jJWR3W7fdyLFKYYkd3fZyIeL3xbfzfSy3f_nmuOKLhP0rYjwLq_9ttQ8tjxRrA/exec';
var MAIN_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbxfxWxPM4kk4Fa242Ewj2T9ktPsn3irBZjAxhWHCaEZkA0CG1ULBZED7PZWVD22cyDO/exec';
var API_TOKEN = 'kbdc-live-g01_zGKPi54vzk2zzKey7UST';
var OUT_SHEET = 'StaffStockOut';
var STAFF_SHEET = 'StaffFull'; // must match the sheet name the main app pushes HR staff to

// Content-Type MUST be text/plain — application/json triggers a CORS preflight
// that Apps Script Web Apps don't answer, which blocks the request.
function api(url, action, payload){
  var body = Object.assign({ action: action, token: API_TOKEN }, payload || {});
  return fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}
function esc(v){ return String(v==null?'':v); }
function byId(id){ return document.getElementById(id); }

// The main app JSON-stringifies array/object fields (like appAccess) before
// writing them to a Sheet cell, so they round-trip as JSON-looking strings
// instead of silently becoming inert text. Mirrors kbdcUnflattenRow().
function unflattenRow(obj){
  var out = {};
  Object.keys(obj||{}).forEach(function(k){
    var v = obj[k];
    if (typeof v === 'string' && v.length > 1 && (v.charAt(0)==='[' || v.charAt(0)==='{')) {
      try { out[k] = JSON.parse(v); return; } catch(e){}
    }
    out[k] = v;
  });
  return out;
}
function isOwnerDesignation(emp){
  return emp && (emp.designation==='Owner'||emp.designation==='Medical Director'||emp.designation==='Clinical Director'||emp.designation==='Admin Head'||emp.isOwner===true);
}
function hasInventoryAccess(emp){
  if (isOwnerDesignation(emp)) return true;
  var a = emp.appAccess;
  if (Array.isArray(a)) return a.indexOf('inv')>=0 || a.indexOf('invout')>=0;
  return false;
}

var ITEMS = [], ALL_STAFF = [], CURRENT_EMP = null, MYRECENT = [];

// ─── Simple per-device login throttle — mirrors the main app's: 5 wrong
// PINs locks this device out for 60 seconds. A correct PIN always clears it.
function lockRemaining(){ try{ var u=parseInt(localStorage.getItem('kbdc_so_lock_until')||'0',10); var r=u-Date.now(); return r>0?Math.ceil(r/1000):0; }catch(e){ return 0; } }
function noteFail(){ try{ var fc=parseInt(localStorage.getItem('kbdc_so_fail_count')||'0',10)+1; if(fc>=5){ localStorage.setItem('kbdc_so_lock_until', String(Date.now()+60000)); localStorage.setItem('kbdc_so_fail_count','0'); return true; } localStorage.setItem('kbdc_so_fail_count', String(fc)); return false; }catch(e){ return false; } }
function noteSuccess(){ try{ localStorage.removeItem('kbdc_so_fail_count'); localStorage.removeItem('kbdc_so_lock_until'); }catch(e){} }

function fillLoginNames(){
  var sel = byId('loginName');
  ALL_STAFF.forEach(function(s){
    var o = document.createElement('option'); o.value=s.name; o.textContent=s.name; sel.appendChild(o);
  });
}

function doLogin(){
  var msg = byId('loginMsg');
  var lock = lockRemaining();
  if (lock>0){ msg.textContent = 'Too many wrong attempts. Please wait '+lock+' second'+(lock===1?'':'s')+'.'; msg.className='msg show bad'; return; }
  var name = byId('loginName').value;
  var pin = byId('loginPin').value;
  if (!name){ msg.textContent = 'Please select your name.'; msg.className='msg show bad'; return; }
  if (!pin || pin.length<4){ msg.textContent = 'PIN must be at least 4 digits.'; msg.className='msg show bad'; return; }
  var emp = ALL_STAFF.find(function(s){ return s.name===name && s.pin!=null && String(s.pin)===String(pin); });
  if (!emp){
    var locked = noteFail();
    msg.textContent = locked ? 'Too many wrong attempts. Locked for 60 seconds.' : 'Incorrect PIN.';
    msg.className='msg show bad';
    byId('loginPin').value='';
    return;
  }
  if (!hasInventoryAccess(emp)){
    msg.textContent = "You don't have Inventory access. Ask an admin to grant it in HR Admin.";
    msg.className='msg show bad';
    return;
  }
  noteSuccess();
  CURRENT_EMP = emp;
  byId('whoName').textContent = emp.name;
  byId('login').style.display = 'none';
  byId('form').style.display = 'block';
  loadItemsThenShowForm();
}

function switchUser(){
  CURRENT_EMP = null;
  byId('loginPin').value = '';
  byId('loginMsg').className = 'msg';
  byId('form').style.display = 'none';
  byId('login').style.display = 'block';
}

var ITEMS_LOADED = false;
function stockClass(s){ if(s<=0) return 'out'; if(s<=5) return 'low'; return 'ok'; }

function fillItems(){
  var sel = byId('item');
  sel.innerHTML = '<option value="">-- Select item --</option>';
  ITEMS.forEach(function(it){
    var o = document.createElement('option');
    o.value = it.name; o.textContent = it.name + '  (stock: ' + it.stock + ')';
    sel.appendChild(o);
  });
  if(!ITEMS.length){ // no items loaded — let them type
    sel.style.display='none'; byId('itemText').style.display='block';
  }
}

byId('item').addEventListener('change', function(){
  var it = ITEMS.find(function(x){ return x.name===byId('item').value; });
  var h = byId('stockHint');
  if(it){ h.innerHTML = 'Current stock: <span class="stockpill '+stockClass(it.stock)+'">'+it.stock+' '+(it.uom||'')+'</span>'; }
  else { h.textContent=''; }
});

function currentItem(){ return (byId('item').style.display==='none') ? byId('itemText').value.trim() : byId('item').value; }

function showMsg(text, good){
  var m = byId('msg'); m.textContent = text; m.className = 'msg show ' + (good?'good':'bad');
}

function renderRecent(){
  if(!MYRECENT.length) return;
  var w = byId('recentWrap'); w.style.display='block';
  byId('recent').innerHTML = MYRECENT.slice(0,5).map(function(r){
    var d=''; try{ d=new Date(r.date).toLocaleDateString('en-IN'); }catch(e){}
    return '<div class="rrow"><span><b>'+esc(r.item)+'</b> × '+esc(r.qty)+'</span><span>'+d+'</span></div>';
  }).join('');
}

function submit(){
  var name = CURRENT_EMP ? CURRENT_EMP.name : '';
  var item = currentItem(), qty = parseInt(byId('qty').value,10);
  if(!name){ showMsg('Session expired — please log in again.', false); switchUser(); return; }
  if(!item){ showMsg('Please select or enter the item.', false); return; }
  if(!qty || qty<1){ showMsg('Please enter a valid quantity.', false); return; }

  var btn = byId('submit'); btn.disabled=true; btn.textContent='Saving…';
  var itObj = ITEMS.find(function(x){ return x.name===item; }) || {};
  var row = {
    id: 'SO'+Date.now()+Math.random().toString(36).slice(2,6),
    date: new Date().toISOString(),
    staffName: name,
    item: item,
    cat: itObj.cat || '',
    qty: qty,
    uom: itObj.uom || '',
    issuedTo: byId('to').value.trim(),
    note: byId('note').value.trim(),
    status: 'Submitted'
  };
  // Read-modify-write the register tab so we append without wiping existing rows.
  api(INV_BACKEND_URL, 'getData', { sheet: OUT_SHEET }).then(function(res){
    var rows = (res && res.rows) ? res.rows : [];
    rows.unshift(row);
    return api(INV_BACKEND_URL, 'saveAll', { sheet: OUT_SHEET, rows: rows });
  }).then(function(){
    showMsg('✅ Recorded: '+qty+' × '+item+'. Thank you, '+name+'!', true);
    MYRECENT.unshift(row); renderRecent();
    byId('qty').value=''; byId('to').value=''; byId('note').value='';
    byId('stockHint').textContent='';
    if(byId('item').style.display!=='none') byId('item').value='';
    else byId('itemText').value='';
    btn.disabled=false; btn.textContent='Submit Stock Out';
  }).catch(function(e){
    showMsg('⚠ Could not save: '+e.message+'. Please check your connection and try again.', false);
    btn.disabled=false; btn.textContent='Submit Stock Out';
  });
}

function loadItemsThenShowForm(){
  if (ITEMS_LOADED) return;
  api(INV_BACKEND_URL, 'getData', { sheet:'InventoryItems' }).then(function(r){ return (r&&r.rows)||[]; }).catch(function(){ return []; })
    .then(function(rows){
      ITEMS = (rows||[]).map(function(r){ return { name:String(r.name||''), cat:String(r.cat||''), uom:String(r.uom||''), stock:Number(r.stock)||0 }; }).filter(function(x){ return x.name; });
      ITEMS_LOADED = true;
      fillItems();
    });
}

// ─── Load staff list (name + PIN + access only — no item/stock data yet,
// that only loads after a successful PIN check) ───────────────────────────
api(MAIN_BACKEND_URL, 'getData', { sheet: STAFF_SHEET }).then(function(r){ return (r&&r.rows)||[]; }).catch(function(){ return []; })
  .then(function(rows){
    ALL_STAFF = (rows||[]).map(unflattenRow).filter(function(s){ return s.active!==false && s.name && s.name!=='—'; });
    fillLoginNames();
    byId('loading').style.display='none';
    byId('login').style.display='block';
    byId('loginBtn').addEventListener('click', doLogin);
    byId('loginPin').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
    byId('switchUser').addEventListener('click', switchUser);
    byId('submit').addEventListener('click', submit);
  }).catch(function(e){
    byId('loading').textContent = 'Could not load. Please refresh. ('+e.message+')';
  });
</script>
</body>
</html>
